name: myprobe_app
description: MyProbe Android client - node monitor with admin management.
publish_to: "none"
version: 1.16.0+23

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  package_info_plus: ^10.2.2
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/bocchi.jpg
    - assets/wallpapers/nightcity_glass.jpg
    - assets/wallpapers/nightcity_dusk.jpg
