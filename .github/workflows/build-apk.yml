name: Build 探针 APK

# 手动触发：Actions 页选这个 workflow 点 Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myprobe-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$V" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-debug.apk myprobe.apk

      - name: 发布 Release（应用内更新用）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 探针 v${{ steps.ver.outputs.version }}
          files: myprobe.apk
